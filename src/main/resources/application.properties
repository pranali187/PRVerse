# ==============================
# Application
# ==============================
spring.application.name=prverse

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/prverseDB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=pass@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=MySuperSecretKeyForJWTAuthenticationInPrverseProject2026SecureKey123456
jwt.expiration=86400000

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================
# DevTools
# ==============================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==============================
# Logging
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==============================
# Jackson
# ==============================
spring.jackson.serialization.fail-on-empty-beans=false

# ==============================
# Spring Security
# ==============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==============================
# Swagger
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html